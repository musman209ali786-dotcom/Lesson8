<!DOCTYPE html>
<html lang="en">
<head>
    <title>My Superhero Card</title>
    <style>
        body {
            background-color: blue; 
            color: white;
            font-family: Arial;
        }
        .heroname{
            font-size: large;
            font-weight: bold;
            color: yellow;
            text-shadow: 3px 3px orange;
        }
        .tagline{
            font-style: italic;
            color: lightblue;
            text-transform: capitalize;
        }
        .label{
            text-transform: uppercase;
            text-decoration: underline;
            color: coral;
        }
        .power{
            color: green;
            font-weight: bold;
        }
        .weakness{
            text-decoration: line-through;
            color: gray;
        }
        .badge{
            font-weight: bold;
            color: gold;
            transform: rotate(35deg);
        }
    </style>
</head>
<body>
    <h1 class="heroname">
        Superman
    </h1>
    <p class="tagline">
        he is a super hero
    </p>
    <p class="power">Can shoot lazer</p>
    <p class="power">Can Fly</p>
    <p class="weakness">
        Green color CryptoKnight
    </p>
    <h2 class="badge">
        Peoples' Hero
    </h2>
</body>
</html>
