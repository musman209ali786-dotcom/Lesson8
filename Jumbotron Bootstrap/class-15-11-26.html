<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>My Science Lab</title>
        <meta name="viewport">
        <link rel="stylesheet"href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
        <style>
            body{
                background-color: aliceblue;
                font-family: cursive;
                text-align: center;
            }
            .jumbotron{
                background-color: gray;
                border-radius: 12px;
                border: darkgreen;
            }
            .section-title{
                color: cadetblue;
                font-family: 'Courier New', Courier, monospace;
                font-weight: inherit;
                font-style: oblique;
            }
            p{
                font-weight: bold;
                word-spacing: 2px;
            }
        </style>
    </head>
    <body>
        <div class="jumbotron jumbotron-fluid">
            <div class="container">
                <h2>Chemistry - A branch of Science</h2>
                <p>Chemistry is the basic study of matter. It's full of information and <mark>Confusion</mark>.</p>                
            </div>
        </div>
        <button class="btn btn-primary">Chemistry</button>
        <button class="btn btn-success">Biology</button>
        <button class="btn btn-warning">Physics</button>
        <button class="btn btn-danger">Astronomy</button>
        <h2>
            Number of Experiments 
            <span class="badge bg-primary">7</span> <br>
        </h2>
        <p>
            Number of Failures
            <span class="badge bg-danger">49</span>
        </p>
        <p>
            Number of Successes
            <span class="badge bg-success">5</span>
        </p>
        <h2>
            Research Progress
        </h2>
        <p>
            Chemistry
        </p>
        <div class="progress mb-3">
            <div class="progress-bar bg-success" style="width: 85%;">85%</div>
        </div>
        <p>
            Biology
        </p>
        <div class="progress mb-3">
            <div class="progress-bar bg-primary" style="width: 60%;">60%</div>
        </div>
        <p>
            Physics
        </p>
        <div class="progress mb-3">
            <div class="progress-bar bg-danger" style="width: 30%;">30%</div>
        </div>
        <p>
            Astronomy
        </p>
        <div class="progress mb-3">
            <div class="progress-bar bg-warning" style="width: 90%;">90%</div>
        </div>
        <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
    </body>
</html>
