<!DOCTYPE html>
<html>
    <head>
    <title>My Pet Page</title>
    <style>
        body{
            font-family: Arial;
            background-color: yellow;
            padding: 12px 10px 10px 4px;
            min-height: 100px;
        }
        h1 + h2{
            color: darkorange;
        }
        .top-bar{
            position: fixed;
            top: 0px;
            left: 1px;
            right: 1px;
            background-color: lightgray;
            color: black;
            padding: 12px;
        }
        .list-item{
            background: white;
            border: 2px solid gray;
            padding: 8px;
            margin: 9px;
        }
        .special-note{
            position: relative;
            left: 10px;
            background-color: lightblue;
            padding: 15px;
        }
        .pet-card{
            position: relative;
            background-color: azure;
            border: 3px solid black;
            padding: 9px;
        }
        .badge{
            position: absolute;
            left: 20px;
            bottom: 100px;
            background-color: darkgray;
            color: red;
            padding: 12px 9px 10px;
        }
        .section-label{
            position: sticky;
            top: 20px;
            background-color: white;
            color: forestgreen;
            padding: 9px 10px 11px;
            margin: 2px 3px 4px;
        }
    </style>
    </head>
    <body>
        <div class="top bar">
            <h1>Buddy</h1>
        </div>
        <p class="list item">
            these are the list items for buddy.
        </p>
        <h3 class="special-note">
            Please be a good buddy
        </h3>
        <p class="pet-card">
            Dog <br>
            Cat <br>
            Tiger <br>
            Ocelot <br>
            Chick <br>
        </p>
        <p class="badge">
            this is the badge for pets
            badge
            badge
        </p>
        <div class="section-label">
           <h2>Much more pets</h2>
           <ul>
            <li>Hyena</li>
            <li>Deer</li>
            <li>Lion</li>
            <li>Panda</li>
            <li>Elephant</li>
           </ul>
        </div>
    </body>
</html>
