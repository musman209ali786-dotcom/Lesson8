<!DOCTYPE html>
<html>
<head>
<title>Study Progress Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>

<div class="container mt-4">

<div class="bg-light p-4 rounded">
    <h1>My Study Progress</h1>
    <p>Track your learning progress!</p>
</div>

<h2 class="mt-3">My Subjects</h2>

<p>Math <span class="badge bg-primary">10 Lessons</span></p>
<div class="progress mb-3">
    <div class="progress-bar" style="width: 80%">80%</div>
</div>

<p>Science <span class="badge bg-success">8 Lessons</span></p>
<div class="progress mb-3">
    <div class="progress-bar bg-success" style="width: 60%">60%</div>
</div>

<p>English <span class="badge bg-warning">5 Lessons</span></p>
<div class="progress mb-3">
    <div class="progress-bar bg-warning" style="width: 40%">40%</div>
</div>

</div>

</body>
</html>
